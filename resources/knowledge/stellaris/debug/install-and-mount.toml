validation = [
    "判定\"挂载了没\"只用会报错的重复键探针；不写日志的重复键（common/species_classes/ 等）不能用作判定。",
    "探针文件用完必须删除，它本身会覆盖一个 vanilla 键。",
    "path= 用正斜杠；内容路径保持纯 ASCII。",
    "只改 dlc_load.json 不算\"已启用\"，启动器重写后即失效。",
    "核对字段前先确认安装版本，多安装时显式指定。"
]

