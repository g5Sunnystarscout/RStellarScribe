id = "localisation-codes"

title = "Localisation Rich Text Codes"

category = "localisation"

file_types = [
    "localisation/**/*.yml",
    "common/scripted_loc/*.txt",
    "common/scripted_variables/*.txt",
    "interface/*.gfx"
]

tags = [
    "dollar-codes",
    "icons",
    "colour-codes",
