validation = [
    ".gfx 存成 UTF-8 无 BOM（与 localisation 相反）；有 BOM 时整个文件被跳过，所有精灵消失且界面上只是空白。",
    "外层块必须是 spriteTypes = {：131 个文件里 125 个这样拼，0 个用 SpriteTypes；写成 types 则整文件无效。",
    "块类型决定可用字段：spriteType 不接受 size（8539 条里 0 次）与 borderSize（0 次）；要声明尺寸用 corneredTileSpriteType（335 条里 25 条写 size）或 progressBarType。progressBarType 用 textureFile1/textureFile2，写单数 texturefile 无效（195 条里 0 次）。",
    "精灵名全局唯一：9197 条 sprite 声明里没有任何名字被声明两次（唯一的 9 组重名全在字体上，bitmapfont 与按语言的 bitmapfont_override 共用名字，属正常写法）。重名会按加载顺序互相遮蔽。",
    "所有 name 值都匹配 [A-Za-z0-9_]（9243 条无一例外）；引号、空格、连字符、点都不能用，用了 .gui 就引用不到。",
    "GFX_ 前缀是约定而非引擎要求：9197 条里 9171 条有前缀（99.7%），26 条没有（cursor 在 interface/core.gfx:2、gfx_transparency 同文件第 9 行、SandboxFloaterBackground 在 interface/eu4_placeholders.gfx:20）。加前缀更安全。",
    "内联文字图标必须是 GFX_text_<token>，loc 里写 £token£（去掉两层前缀）。最硬的证据是 vanilla 为一个已有普通名字的贴图又写了一遍别名：interface/astral_planes_resources.gfx 第 3 行的块声明 GFX_resource_astral_threads，第 13 行的块声明 GFX_text_resource_astral_threads，两者指向同一个 astral_threads.dds。若存在普通 GFX_ 回退，这个别名毫无意义。",
    "精灵改名或新增后要在 .gui 里真正引用才会显示；.gui 的 iconType 不接受 size（只有 scale），带尺寸的装饰面板要用 containerWindowType + background。",
    "改贴图分辨率必须重启游戏；reload texture all 只重载内容。",
    "texturefile 路径大小写要与磁盘一致（Windows 不敏感，Linux/macOS 敏感），并且不要带尾随空格。"
]

