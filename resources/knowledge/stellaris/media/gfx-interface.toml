validation = [
    ".gfx 用 UTF-8 无 BOM 保存；.yml 才是 UTF-8 with BOM。",
    "name 全局唯一；重复定义会导致精灵被覆盖或冲突。",
    "texturefile 路径大小写必须与磁盘一致（Mac/Linux 大小写敏感）。",
    "被 .gui/loc 引用的名字必须真实存在：改名前先全局搜索 GFX_ 引用。",
    "改了贴图分辨率必须重启游戏；reload texture all 只重载内容。",
    "自定义文字图标务必是 GFX_text_ 前缀，loc 引用时去掉前缀。"
]

