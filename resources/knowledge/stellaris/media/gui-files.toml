validation = [
    "guiTypes = {} 外层块；括号配平（vanilla 用 1 个 Tab 缩进）。",
    "每个节点 name 唯一；background 内多个块各自 name 唯一。",
    "spriteType / quadTextureSprite 引用的 GFX_* 必须在某个 .gfx 里定义过。",
    "effectButtonType 的 effect 必须在 /common/button_effects/ 存在。",
    "custom_gui 与 containerWindowType 名严格一致；不要删 vanilla 子元素。",
    "改 .gui 后可用 reload xxx.gui 验证，不必重启。",
    "只改 size/position/spriteType 属性通常安全；改动容器层级顺序有风险（官方示例警告\"don't rearrange the logic of containers\"）。"
]

