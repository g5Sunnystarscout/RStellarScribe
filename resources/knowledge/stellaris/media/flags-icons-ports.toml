id = "flags-icons-ports"

title = "Flags, Icons, Portraits, Music and Sound"

category = "media"

file_types = [
    "flags/**/*.dds",
    "gfx/interface/icons/**/*.dds",
    "gfx/portraits/**/*.txt",
    "music/*.asset",
