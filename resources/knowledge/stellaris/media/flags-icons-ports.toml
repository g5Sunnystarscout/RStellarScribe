validation = [
    "三个旗帜贴图同名、尺寸分别为 128 / 256 / 24，位置分别为 flags/<cat>/、.../map/、.../small/。",
    "flags/<cat>/usage.txt 存在，否则 AI 会拿它生成旗帜。",
    "FLAG_CATEGORY_<cat> 本地化存在，否则分类名显示为 key。",
    "本地化必须是 UTF-8 with BOM；.gfx / .asset 是 UTF-8 无 BOM。",
    "肖像必须同时：在 gfx/portraits/portraits/*.txt 定义、entity 在 .asset 存在、名字登记进 common/species_classes。",
    "音乐文件用 .ogg 44.1 kHz；.asset/.txt 用唯一文件名。",
    "路径与文件名大小写：Mac/Linux 敏感。",
    "替换 vanilla 资源时用相同目录路径 + 相同文件名，扩展名不能换来换去（.dds 就是 .dds）。"
]

