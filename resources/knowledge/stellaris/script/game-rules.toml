body = """
## 概要\n\n`common/game_rules/*.txt` 不是什么带 `default` / `setting` 字段的配置表，而是**一组被引擎按名字硬编码调用的脚本化触发器**：引擎在判定\"某个动作能不能做\"时会去查同名规则块，**规则为假时该动作不可用**，并可从块内 `custom_tooltip = { fail_text = ... }` 取出给玩家看的失败原因。本机 4.1.7 的 `00_rules.txt` 共 197 个规则块（`is_valid_rival`、`can_add_claim`、`can_colonize_planet`、`can_declare_war`、`can_modify_species` 等），全量检查**没有任何 `default =` 或 `setting =` 行**；因此脚本里也**没有** `has_game_rule` 这一类触发器可用（详见\"待确认\"）。\n\n## 文件位置与命名\n\n- 规则本体：`common/game_rules/00_rules.txt`（主要）、`01_gui_rules.txt`（界面用规则）。\n- 修改方式：整块覆盖同名规则（LIOS 语义，同名后者生效）。要新增规则，只有引擎认识的名字才有意义；自造名字不会被任何逻辑查询。\n- 开局设置项（难度、星系大小、胜利年份等）在另一个文件：`common/gamesetup_settings/gamesetup_settings.txt`，它只列出 `setting = <token>` 的界面槽位，token 由引擎硬编码，**不是** game_rules 的 `setting` 字段。\n- 本地化：`01_gui_rules.txt` 与 `gamesetup_settings.txt` 里的名称走 `localisation/*.yml`，`gamesetup_settings.txt` 中分类键形如 `GALAXY_SETTINGS_CATEGORY_GAMEPLAY`、`GALAXY_SETTINGS_CATEGORY_GALAXY`。\n\n## 语法与字段\n\n规则块 = 触发器块 + 失败提示；`root` 与 `this` 的含义按规则顶部的注释而定：\n\n\n\n只显示提示、不写块形式时（补充说明型）：\n\n\n\n策略要点：\n\n- 一个规则块里可以叠**多个** `custom_tooltip = { fail_text = ... }`，每个对应一条失败原因；引擎按块顺序取第一条为假的提示。\n- `hidden_trigger = { ... }` 用于放\"必须满足但不必向玩家解释\"的条件。\n- 规则块整体语义是 AND：所有顶层语句都为真，动作才可用。\n- `custom_tooltip = { fail_text = KEY ... }` 内部同样是条件块，`prev` 指向规则块的 this，`root` 指向 root。\n\n## 常见错误\n\n- 给规则块写 `default = yes` / `setting = { ... }`：本机 4.1.7 本体文件中不存在这些字段，写了没有意义。\n- 在 mod 脚本触发器里写 `has_game_rule = xxx`：本机 `stellaris.exe` 中不存在 `has_game_rule`、`check_game_rule`、`set_game_rule` 字符串，本体脚本也从未使用；这类写法只出现在早期版本的资料里。\n- 把 `gamesetup_settings.txt` 的 `setting` 槽位当成 game_rules 的字段，试图用它注册新开局选项（引擎硬编码 token，mod 无法新增）。\n- 覆盖 `00_rules.txt` 中的规则时漏掉 `hidden_trigger` 段，导致原本隐藏的实现条件变成玩家可见提示。\n- 失败提示写成键名以外的内容（带空格的句子），界面显示原文。\n\n## 待确认\n\n- `has_game_rule` 触发器：本机 4.1.7 实测在 `stellaris.exe` 与全部 `common/**` 脚本中都不存在；早期 wiki/教程描述过它，是否在某个 3.x 版本中被移除、以及有无替代写法（直接复用规则块名作为脚本化触发器条件）均未验证。\n- `common/game_rules` 与多人/成就的具体关系未在官方页面或本机文件中找到可引用说明（`Game_rules` 页面 404），本条目不给出结论；存档一致性/成就限制请在实测或官方 patch notes 中另行确认。\n- 规则块被引擎调用的确切时机与作用域（`root` / `this` 由引擎硬编码，本体用注释标注）没有集中文档，只能逐条读本体注释。
"""

syntax_blocks = [
    "# common/game_rules/zz_my_mod_rules.txt\n# Root = 发起国  This = 目标国\nmy_mod_can_propose_armistice = {\n\thidden_trigger = {\n\t\t# 内部实现细节，不生成提示\n\t\tif = {\n\t\t\tlimit = { root = { is_country_type = default } }\n\t\t\talways = yes\n\t\t}\n\t}\n\tcustom_tooltip = {\n\t\tfail_text = MY_MOD_ARMISTICE_NEEDS_COMMS\n\t\troot = { has_communications = prev }\n\t}\n\tcustom_tooltip = {\n\t\tfail_text = MY_MOD_ARMISTICE_NEEDS_TRUCE_TECH\n\t\troot = { has_technology = tech_my_mod_armistice }\n\t}\n}",
    "# 本机 00_rules.txt 中既有块形式，也有纯 loc 键形式\ncan_modify_species = {\n\tcustom_tooltip = my_mod_species_note_tt\n\troot = { has_technology = tech_gene_modding }\n}"
]

