validation = [
    "先确认要改/要查的规则名来自本机文件，而不是 wiki 记忆：Select-String -Path \"<Stellaris>\\common\\game_rules\\*.txt\" -Pattern '^[a-z_0-9]+\\s*=\\s*\\{' | ForEach-Object { $_.Line.Trim() }。",
    "每个 fail_text 都要在本地化里有对应键，否则玩家看到原始键名（本体示例：INVALID_RIVAL_DESC、CANNOT_ADD_CLAIM_POLICY，都在 localisation/english/main_*.yml 中）。",
    "覆盖本体规则时把整个块抄下来再改，部分覆盖会把本体原有的失败提示丢掉。",
    "写完在游戏里实际触发一次（例如尝试添加宣称）确认提示文本与禁用状态符合预期，别只看 error.log。",
    "需要给玩家看的条件放 custom_tooltip；不想解释的内部条件放 hidden_trigger。"
]

