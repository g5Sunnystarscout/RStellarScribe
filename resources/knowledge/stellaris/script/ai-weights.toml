validation = [
    "权重 ≠ 概率。权重只决定\"排序中谁更靠前\"或\"抽签池里的相对份额\"，不同系统用法不同（有的取最高值，有的按权重随机，还有内置扰动），不能把 base = 100 理解成 100% 或\"百倍概率\"。",
    "modifier 块按书写顺序依次生效：先 base/factor 起始，再逐块 add/factor/set…。因此 factor = 0 之后若还有其他 add，最终值会变成非零——想彻底排除，factor = 0 必须放在所有 add 之后，或直接用 set = 0（本机 common/armies/01_assault_armies.txt 就用 set = 0）。",
    "一个 modifier 块内的多个条件默认是 AND；要 OR/NOT 必须显式写 OR = { } / NOT = { }。",
    "factor 可连乘，数值会迅速膨胀（5 连乘 6 次 factor = 2 得 320），factor 与 add 都接受负数。",
    "weight_modifier 顶层再写一个 factor = X 会覆盖基础系数而不是相乘（本机科技文档明确：\"weight and factor will instead overwrite the base value\"）。",
    "新加的内容必须补权重：新建筑/新岗位没有 ai_weight 时 AI 很可能永远不用；新特质/新加成若没有让相关岗位权重感知，AI 会把人派到不最优的岗位上。",
    "校验方式：把候选对象的权重块与本体同类对象逐个对照（键名、起始键、是否有 base/weight/factor），不要跨目录套用；用 -debug_mode 观察 AI 实际选择。"
]

