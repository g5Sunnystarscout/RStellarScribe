validation = [
    "在错误的作用域调用效果不会报错、也不会有任何事发生；先用 exists 确认作用域，再执行关键效果。",
    "add_modifier 的 modifier 必须是 common/static_modifiers/ 或 common/event_modifiers/ 等处真实存在的键。",
    "旗帜键与修正键都是自由命名，但不要与 vanilla 撞名；用 mod 前缀。",
    "循环务必有界：while 必须有 count；while 的 count 可接受变量。",
    "hidden_effect 只影响 tooltip，内部效果照常执行；tooltip = { } 里的语句不会执行。",
    "调试时先看 error.log，再看 game.log（log = <string> 的输出去向）。"
]

