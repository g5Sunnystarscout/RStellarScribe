validation = [
    "每个触发器/效果的使用位置先用 logs/script_documentation/effects.log、triggers.log 里标注的 scope 列核对。",
    "切换 owner / controller / leader 前一律先 exists，否则会往 error.log 灌错误。",
    "用 is_scope_type = <类型> 断言当前作用域；debugtooltip 与 error.log 结合排查。",
    "on_action 会覆盖 THIS / FROM 的含义（例如 on_ship_disabled 触发的脚本里 this 是受损舰船、from 是造成损伤的船），不要照搬事件里的直觉。"
]

