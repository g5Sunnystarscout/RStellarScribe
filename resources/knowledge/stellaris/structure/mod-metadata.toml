validation = [
    "name 存在且非空；descriptor.mod 与 <modname>.mod 的 name 一致。",
    "<modname>.mod 里 path 用的是 /，且指向真实存在的模组根目录。",
    "descriptor.mod 里没有 path（实机统计 32 个真实 descriptor.mod 中 path 出现 0 次）。",
    "supported_version 形如 v4.x.y 或 v4.x.*；只把最后一段写成 *（游戏只支持最后一段通配，第二段通配虽被启动器接受但会写 error.log）。生态中确实存在 v4.* 与单写 * 的用法，但那属于超出文档的写法。",
    "3.12 之前的版本号不带 v 前缀；面向 3.12+ 的模组应带 v（实机同时见到 2.8.1、1.2.5 这类老式无前缀写法）。",
    "tags 数量 ≤ 10，且只使用真实模组中用过的取值（见上表 13 个）或其他预定义标签，含空格的标签加了引号。",
    "dependencies 里写的是模组显示名，不是文件名、不是工坊 ID；若使用它，确保不是靠它来实现覆盖（它只影响加载先后）。",
    "version 不承担兼容性判断职责，别把它当作 supported_version 使用。",
    "上传前 picture=\"thumbnail.png\" 已存在，且 thumbnail.png 在模组根目录、小于 1 MB（真实模组中约一半写了 picture）。",
    "不生成 replace_path：65 个真实描述文件中零出现，官方字段表也没有它。",
    "多人游戏中所有玩家启用完全相同的模组集合与版本；校验和不一致时无法进入同一局。"
]

