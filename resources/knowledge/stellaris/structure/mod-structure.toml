validation = [
    "mod 目录下存在 <modname>.mod，且其中 path=\"mod/<modname>\"；路径用正斜杠 /，不用 \\ 或 \\\\。",
    "模组根目录存在 descriptor.mod，且没有 path 字段（写了也被忽略）。",
    "根目录下每个子目录名与游戏安装目录中的名字逐字一致（localisation 用 s 拼写，不是 localization）。",
    "path 相对路径以 …\\Documents\\Paradox Interactive\\Stellaris 为基准；启动器不会找到写在别处（如游戏安装目录）的模组。",
    ".mod 与 descriptor.mod 的 name 一致，否则启动器会以 descriptor.mod 为准并改写 .mod。",
    "同一模组不同时以本地文件和创意工坊订阅两种形式存在：游戏会拒绝加载同名模组。",
    "修改了 vanilla 同名文件时，确认自己确实要整文件覆盖，而不是新增一个不同名文件（新增文件即可被加载，无需覆盖）。",
    "需要单个本地化 key 覆盖 vanilla 时，文件放在 localisation/replace/，而不是整文件同名覆盖。",
    "每个用到的 common/ 子目录名都能在安装目录 Get-ChildItem -Directory 的输出里找到（如 governments、traits、pop_jobs、scripted_effects、scripted_loc、scripted_variables、on_actions、game_concepts）；名字打错等于整份文件不加载。",
    "不创建 localisation_synced/：4.1.7 安装目录下不存在该目录（遍历确认），只有 localisation。",
    "排查\"模组没生效\"时，先确认 dlc_load.json 的 enabled_mods 数组里存在 mod/<modname>.mod 这一项。"
]

