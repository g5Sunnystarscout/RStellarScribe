validation = [
    "class = \"rl_...\" 这类随机恒星类必须存在于 common/star_classes/，写错会导致 class = random 的行星生成失败（此时等同 class = none，行星不生成）。",
    "modifier = \"pm_xxx\" 必须存在于 common/planet_modifiers/；anomaly 必须是已定义异常。",
    "行星类型的 district_set 必须与区划的 uses_district_set 值对得上，否则区划不会出现。",
    "name 字段写的是本地化键；init_effect = { set_name = \"...\" } 里的字符串是直接显示的字面量，不会查本地化。",
    "usage 不写时该 initializer 只能被脚本显式调用（Origin、预设帝国、neighbor_system）。",
    "调试：-script_debug 启动参数会在随机行星类选择失败时写错误日志；控制台 Draw.SystemInit 显示实际使用的 initializer。",
    "名称表里的名称也是本地化键（如 HUM1_SHIP_...），必须在 localisation/ 里有对应条目，否则显示为键名。",
    "spawn_system 的距离要写成 min_distance >= X / max_distance <= Y（运算符在键名里）；裸 min_distance = X 是等号语义，不是区间下限。取值是\"银河半径的百分比、从银心量起\"，但别把它当 0-100 的硬上限——原版 L-Cluster 用了 550/560。",
    "spawn_system 的合法作用域是 megastructure planet ship fleet galactic_object starbase no_scope colony，没有 country；国家事件里必须套 no_scope = { ... }。",
    "一次生成多个星系时，把 spawn_system 包在 set_spawn_system_batch = begin … = end 之间，并给每个星系错开距离带；否则后续 spawn 会因落点冲突失败。",
    "hyperlane = no 才产生孤立星系；不写或写 yes 时，靠银心越近越容易因找不到可连接的邻近星系而失败。",
    "系统外半径上限是 最外层累计 orbit_distance + 130 < 600，即累计值最大 469（470 越界）——130 是 SYSTEM_OUTER_RADIUS_OFFSET(100) + SYSTEM_INNER_RADIUS_OFFSET(30)，被执行的常量是 CELESTIAL_WARNING_COORDINATE_VALUE = 600。越界报 System <key> with initializer <key> is too big. Make sure the outer radius is smaller than 600.。小行星带、天体的 size、星系在地图上的位置都不参与这个计算（实测）。注意：这是\"警告线\"，不是\"生成上限\"——超过它的星系照样生成（链 3480 实测可生成），代价只是星系视图里轨道线 / 重力井环被截断，详见下文\"超大星系\"一节。",
    "change_orbit = <n> 是对当前累计轨道半径的增量（不是给后续天体设绝对半径）：+n 往外推、-n 往内收，原版有 27 处负值。同轨道的多个天体用 change_orbit = <n> 后连写几个 orbit_distance = 0 + 不同 orbit_angle。",
    "恒星槽位的 entity 是原样查找（写 g_star_class_star_entity 这样的完整资源名）；行星槽位才走\"基名 + 变体后缀\"。在星位上写基名会报 Failed to find entity \"<name>_xx_entity\"。",
    "star = yes 的行星类需要补 climate = \"luminosity_<0-4>\" 与 min_distance_from_sun = 0 / max_distance_from_sun = 0 / spawn_odds = 0（Pegasus 4.4.6 里 14 个星类全都这么写，且全都 colonizable = no）；原版星类的 entity_scale 基本都是 20.0（pc_t_star 30.0、pc_protostar 15.0、pc_rift_star 6.0 例外）。",
    "想让 initializer 只被脚本生成、不参与随机银河生成，写 usage = misc_system_init + usage_odds = 0。",
    "想让星系落在银河正中央：initializer 没有位置字段，必须用 spawn_system + authorize_spawn_on_galactic_core = yes（配合 min_distance >= 0 / max_distance <= 0 与 hyperlane = no）先落一个锚点，再用 move_system 把真实星系搬过去；move_system 的作用域只有 galactic_object。",
    "银心没有恒星（map/galaxy/galaxy_shapes.txt:4 = num_stars_core_perc = 0），被搬进银心的星系要用 add_hyperlane = { from = ... to = ... } 重新接入星网，否则星系存在但不可达（原版套路：events/origin_events_shadows_shroud.txt:122-152 的 every_neighbor_system_euclidean + NOT = { has_hyperlane_to = prev }）。",
    "move_system 的距离区间无法满足时会兜底把星系丢到银心（effect_impl_spawn_system.cpp:705），并在日志里留一行 move_system: Failed to find a position within defined parameters ... sending it to the galactic core instead——这是可用的确定性行为，不是需要\"修掉\"的故障。",
    "从 init_effect 生成成对虫洞：两次 spawn_natural_wormhole + link_wormholes = prev，并且必须在嵌套作用域里核对 this/prev 的指向（random_system = { ... } 一旦进入，this 就已经不是本星系了）；漏掉连接会留下原版注释所说的 \"orphan wormhole\"。",
    "is too big 是警告，不是生成失败：链 3480 的星系（以及 1200 / 2000）都能生成，天体和星系本体都在。真正会\"看起来不对\"的是星系视图：3D 天体照画，但轨道线与边界/重力井圆环在上下两端被截断，平移可以找回。别为了消掉这行日志去砍星系尺度。",
    "想让超大星系在视图里完整显示，目前没有已证实的办法：改 SYSTEM_FAR_PLANE_DISTANCE_BASE / ZOOM_STEPS_SYSTEM_PERCENTAGES / SYSTEM_CAMERA_RESTRICT_EXTRA_SPACE 的实机实验失败了（见上文\"超大星系\"一节的 待确认）。要么接受截断，要么把星系控制在相机能容纳的尺度内。",
    "调 define 时不要看 game.log 的 N defines loaded 当证据：未知键被静默忽略，同一键的多 mod 冲突也不留日志；唯一可靠判据是一个玩家肉眼可见的数值变化。"
]

