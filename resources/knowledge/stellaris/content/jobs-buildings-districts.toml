validation = [
    "建筑必须有 building_sets，区划必须有 zone_slots，zone 必须有 zone_sets 与 max_buildings，否则 4.x 下不显示或报错。",
    "zone_slots 里引用的 slot 必须在 common/zone_slots/ 定义；slot 必须用 include 或 included_zone_sets 至少允许一个 zone。",
    "岗位产出写在 resources = { produces = { ... } } 内，不要写成顶层的 produces.",
    "本地化键：<key>、<key>_desc，岗位还有 job_<key>_effect_desc（用于 triggered_desc）。",
    "图标：建筑默认取 gfx/interface/icons/buildings/<building_key>.dds，并需在定义里显式写 icon 才会生效。",
    "用 -debug_mode 或 error.log 检查未注册的 tag、缺失的 building set、缺失的 zone slot。"
]

