validation = [
    "先证伪目录：Test-Path \"$ST/common/ship_abilities\" 必须为 False；递归 Select-String ship_abilities 必须 0 命中。任何\"在 ship_abilities/ 里写 X\"的教程对本版本都是错的。",
    "按钮名核对 exe：用 ASCII 读出 stellaris.exe 全部字符串。grow_button_effect/arkship_build_armies/arkship_build_ships 各 1 次，grow_up_button_effect 0 次——exe 只认按钮 name，不认 effect 目标。这是判断\"某按钮能不能自己造\"的唯一可靠方法。",
    "effectbuttonType 只能用在 exe 已经实例化它的窗口。全本体只有 fleet_view.gui:708/:1785 两处；在别处（如 ship_view.gui、planet_view.gui）新增一个 effectbuttonType 不会生效。",
    "scripted_action 回调必须是真 on_action：on_completed = on_xxx 的 on_xxx 必须能在 common/on_actions/*.txt 里找到。本体实证：00_paragons.txt:13 的 on_completed = on_beholder_target_planet_reached ↔ 02_component_on_actions.txt:12。",
    "carries_colony 需要 class = shipclass_starbase（00_ship_sizes.txt:97-99 原注释），否则方舟/殖民逻辑不成立。",
    "create_army 的作用域：从 owner = { ... } 内调用时 owner = root.owner 会指错（此国非彼国）。最稳的写法是先取目标的 owner：owner = { create_army = { owner = prev.owner ... } }，或改用 root.owner = { create_army = { owner = root.owner ... } }。改完必须进游戏实点按钮验证，不要只看 error.log 不报错。",
    "本地化键大小写不敏感但必须存在：tooltip / activity_key / context_menu_name / icon 四个键缺一个按钮可能不显示或显示为空。"
]

