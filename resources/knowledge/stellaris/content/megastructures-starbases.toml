validation = [
    "starbase_levels 的 ship_size 必须指向 common/ship_sizes/ 中已定义的键，next_level 必须指向另一个等级键，否则升级链断裂。",
    "模块的 section 必须存在于 common/section_templates/，且该 section 的 fits_on_slot 要匹配基地舰船尺寸的 section_slots。",
    "巨型结构升级链不可分叉：一个前置只能对应一个升级目标。",
    "construction_blocks_and_blocked_by 取 none / self_type / multi_stage_type（3.4 起取代了旧的 construction_blocks_others 与 construction_blocked_by_others）。不要只设其中一个方向。",
    "图例与新解锁提示：show_in_tech 让科技卡显示\"解锁恒星基地模块\"，custom_tooltip_requirements 让巨型结构显示额外要求。",
    "starbase_types 不影响玩家可用性，只影响 AI 与界面称号——写错了不会导致崩溃，但 AI 不会建造。"
]

