validation = [
    "能否装到船：组件 size 必须等于某舰段提供的槽尺寸。护卫舰 section_templates/corvette.txt:37 aux_utility_slots = 2 → size = aux 可装；武器槽靠 component_slot = { template = \"small_turret\" }（同文件 :26），而 component_slot_templates/00_component_slots_turrets.txt:16-17 的 small_turret 正是 size = small。",
    "能否在设计器出现：检查 potential（This = ship design，From = country）。缺省则所有舰可见。",
    "验证组件出现在设计师：进游戏舰船设计器，护卫舰的辅助槽应能选到 MY_AUX_SENSOR_ARRAY；控制台 reload component_templates 或重开游戏可刷新；error.log 不应出现 \"unknown key\" 或图标缺失。",
    "图标必须用已存在的 GFX 名，写错只在 error.log 里静默报错。",
    "resources.category 用 ship_components，与舰段用 ship_sections、舰种用 ships 区分。"
]

