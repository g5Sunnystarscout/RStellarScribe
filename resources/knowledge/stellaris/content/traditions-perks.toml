validation = [
    "图标必须自己在 interface/*.gfx 里注册 spriteType = { name = \"GFX_<传统键>\" ... }，建议放 gfx/interface/icons/traditions/；飞升天赋同理，建议 gfx/interface/icons/ascension_perks/。没有 GFX 定义的传统在 UI 上没有图标。",
    "新增传统树必须同时处理 interface/topbar_traditions_view.gui（模板与摆放）与 ascension_perks_view.gui（AP 列表），否则界面不显示。",
    "完成奖励（finisher）必须含 ascension_perks_add = 1，且 README 说它不能有 cost。",
    "localisation 键：传统用 <key>（名称）、<key>_desc（自动效果说明）、<key>_delayed（风味文本）；README 第 27 行明确\"描述键必须是传统键加 _delayed（传统）或 _desc（飞升天赋）\"。采纳/完成奖励另有 tr_x_adopt、tr_x_adopt_desc、tr_x_adopt_effect、tr_x_finish、tr_x_finish_effect。",
    "脚本接口：条件 has_tradition、has_active_tradition、has_ascension_perk；效果 add_tradition。4.0 新增 remove_tradition、remove_tradition_tree、copy_traditions_from、add_ascension_perk、remove_ascension_perk、copy_ascension_perks_from。"
]

