id = "custom-gui"

title = "Writing a Custom GUI"

category = "content"

file_types = [
    "interface/*.gui",
    "common/button_effects/*.txt",
    "common/static_modifiers/*.txt",
    "events/*.txt"
]

tags = [
    "guiTypes",
    "containerWindowType",
    "effectbuttonType",
