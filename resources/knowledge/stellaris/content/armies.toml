validation = [
    "目录先 Test-Path：只认 common/armies/。写进 common/army_types/ 会被静默忽略，控制台不报错 —— 最常见的\"改了没反应\"。",
    "键名 = 本地化前缀：需存在 <key>:0、<key>_plural、<key>_desc。vanilla 实例：localisation/english/main_1_l_english.yml:2505 assault_army:0、:2508 defense_army:0、:2522 clone_army:0、:2525 robotic_army:1；biogenesis_l_english.yml:1473-1474 perfected_clone_army_plural/_desc。",
    "招募门控四件套：陆军自身 potential_country + potential + allow + prerequisites，再叠加 common/game_rules/00_rules.txt 的两条规则：",
    ":472 can_generate_army_from_colony（This = 殖民地，root = 物种）：非 pc_cosmogenesis_world，且 any_owned_species = { is_same_species = root can_be_soldier = yes }。",
    ":535 can_generate_army_from_species（This = 国家，root = 物种）：非 trait_tankbound，且有 military_service_full 或 military_service_limited（或 owner 为原始文明）。",
    "can_be_soldier 定义在 common/scripted_triggers/00_scripted_triggers.txt:773-781。 推论：测试帝国若兵役为 military_service_none，陆军字段写得再对也不会出现在列表里 —— 这是排查\"造兵按钮没反应\"的具体抓手。",
    "防御军不是招募来的：is_pop_spawned = yes 的 10 个陆军只能由职业生成。链路：job_soldier（common/pop_jobs/02_specialist_jobs.txt:3301，:3346 引入 output/soldier_triggered_modifiers）→ common/inline_scripts/output/soldier_triggered_modifiers.txt:25-32 的 planet_defense_armies_add = 1（条件 owner? = { is_nomadic = no }）。故防御军数量由建筑/职业给的 planet_defense_armies_add 决定（common/buildings/00_capital_buildings.txt:182/271/364）。",
    "occupation = yes 不可建造，只在占领星球时生成（03_occupation_armies.txt）。",
    "defensive = yes 不能运输（三文件第 1 行注释 \"Defensive armies can't transport off the planet\"）。",
    "图标须真实存在：GFX_army_type_assault 在 interface/icons.gfx:189，写错则空图标。"
]

