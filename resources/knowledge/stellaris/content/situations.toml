validation = [
    "on_progress_complete 与 on_fail 里必须有 destroy_situation = this（可改为由事件销毁；README :56、:59 列为强制）。",
    "total_progress 与 end 不能混用：设了 total_progress 后每个阶段只能写 section_weight，反之只能用 end。用 Select-String '^\\s*(end|section_weight)\\s*=' 核对。",
    "阶段图标字段是 icon_background，不是 README :135 的 background（实测 icon_background 505 次、独立 background 0 次）；阶段键必须本地化且必须全局唯一 —— vanilla 的 stage_1:1 \"Stage I\" 是全局单条键（situations_l_english.yml:70），复用它就会覆盖原版。",
    "desc 块内子字段是 trigger（单数）；monthly_progress 的 modifier 若写了 desc，该本地化键必须存在，否则刷错误日志。",
    "situation_log_category 用裸标识符且必须是 6 个已知值之一；局势顶层键不能叫 on_monthly_pulse（on_monthly 实为按局势 id 注册的 on_action）。start_situation 作用域必须是 country（effects.log:2369），写在行星作用域里无效。",
    "影响局势本身的效果应放进事件的 immediate = { }（README :209-211）。"
]

