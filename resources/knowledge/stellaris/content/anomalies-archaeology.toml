id = "anomalies-archaeology"

title = "Anomalies, Archaeological Sites & Special Projects"

category = "content"

file_types = [
    "common/anomalies/*.txt",
    "common/archaeological_site_types/*.txt",
    "common/special_projects/*.txt",
    "events/*.txt"
]

tags = [
    "anomaly",
    "anomaly_event",
    "archaeological_site",
