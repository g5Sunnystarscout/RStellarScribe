validation = [
    "新建 ship_size 时，每个 class 都需要 required_component_set 覆盖到 power_core、ftl_components、thruster_components、sensor_components、combat_computers（民用船按需减少），否则自动设计生成失败、船造不出来。",
    "size 与槽位尺寸必须匹配：武器组件只能进 component = weapon 的槽，舰载机只能进 component = strike_craft 的槽，且尺寸一致。",
    "component_slot 的 name 在同一 section 内不可重复。",
    "tags 用于组件分组与炮塔实体选择，weapon_type_kinetic/energy/explosive 这几个 tag 决定 entities 里取哪个炮塔实体。",
    "改武器数值优先改 weapon_components.csv（或 .ods 后导出），改 .txt 可能被 CSV 覆盖。",
    "检查 error.log 中缺失 GFX/entity 的报错；-debug_mode 有助于定位。"
]

