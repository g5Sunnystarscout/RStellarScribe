validation = [
    "localisation 键约定（本机实测）：title 用 <namespace>.<id>.name，desc 用 <namespace>.<id>.desc，选项依次 <namespace>.<id>.a / .b / .c。这三个是约定而非引擎强制：引擎只会去查你写的那串字符串。可见事件若 loc key 不存在，游戏界面会直接显示 key 原文，所以\"title/desc/option 三件套必须在 localisation/*_l_english.yml 里存在\"是硬要求。依据：localisation/english/anomaly_l_english.yml 中 anomaly.1.name、anomaly.1.desc 与 events/anomaly_events_1.txt 的 id = anomaly.1 一一对应。",
    "loc 文件必须是 UTF-8 with BOM，文件名以 _l_english.yml 结尾，首行必须是 l_english:，每条键前必须有空白缩进；缺 BOM 会静默不加载。",
    "hide_window = yes 的事件不需要 title/desc/option；其余事件至少一个 option，否则出现空白事件框。",
    "交叉引用检查：所有 event_target:<name> 必须在同一条调用链上游被 save_event_target_as 保存过；跨事件/跨 namespace 用 save_global_event_target_as（本机 590 处）并在用完后 clear_global_event_target。",
    "性能：is_triggered_only = yes 会免除每日全对象轮询；mean_time_to_happen 只是拉长轮询间隔，带 modifier 时引擎会每天对每个对象检查一次条件，代价极高。给 planet / system / starbase / leader / pop 事件加 pre_triggers 做廉价前置筛选（见 events/000_added_pre_triggers_to_planet_events.txt）。"
]

