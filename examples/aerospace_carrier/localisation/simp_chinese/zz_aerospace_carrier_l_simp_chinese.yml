l_simp_chinese:
 aerospace_carrier:0 "空天母舰"
 aerospace_carrier_plural:0 "空天母舰"
 pc_aerospace_carrier:0 "空天母舰"
 tech_aerospace_carrier:0 "空天母舰"
 tech_aerospace_carrier_desc:0 "把恒星基地的船坞、殖民地的行政中枢与陆军的集结设施压缩进同一艘舰体：它自带一座可移动的殖民地，能在轨道上轰炸行星、在舰上组建并投送陆军，同时以常规舰队的方式参与太空战。"
 MUSTERING_PLATFORM:0 "集结平台"
 MUSTERING_PLATFORM_desc:0 "舰内的陆军集结与投送平台。为搭载的殖民地提供陆军组建加速与老兵骨干，并强化本舰的对地轰炸。"
 mustering_platform:0 "集结平台装配部"
 mustering_platform_desc:0 "在空天母舰内部划出陆军集结区：缩短陆军组建时间、提高组建速度，并让新组建的陆军自带实战经验。"
 TECH_UNLOCK_AEROSPACE_CARRIER_TITLE:0 "解锁舰船类型：空天母舰"
 TECH_UNLOCK_AEROSPACE_CARRIER_DESC:0 "允许在拥有船坞的恒星基地建造空天母舰。它可以携带一座可移动殖民地，并以此为依托组建陆军。"
 aerospace_carrier_muster_army:0 "组建陆军"
 aerospace_carrier_muster_army_tooltip:0 "在本舰上集结并组建一支突击陆军。"
 aerospace_carrier_mustered_army:0 "空天母舰陆战团"
 aerospace_carrier.1.name:0 "集结完成"
 aerospace_carrier.1.desc:0 "空天母舰上的集结平台完成了整备，一支陆战团已在舰内编成待命。"
 aerospace_carrier.1.a:0 "让他们待命。"
 TECH_UNLOCK_AEROSPACE_CARRIER_SHIP_TITLE:0 "解锁舰船类型：空天母舰"
 TECH_UNLOCK_AEROSPACE_CARRIER_SHIP_DESC:0 "你可以在拥有船坞的恒星基地建造空天母舰。它自带一座可移动殖民地，能以轨道轰炸打击行星，并在舰上组建陆军。"
 AEROSPACE_CARRIER_BRIDGE_TITLE:0 "空天母舰 · 舰桥"
 AEROSPACE_CARRIER_BRIDGE_DESC:0 "这里是舰桥。你可以直接在此组建陆军、或为对地轰炸做前置准备。所有指令都作用于当前选中的空天母舰。"
 AEROSPACE_CARRIER_BRIDGE_STATUS:0 "舰载设施\n· 集结平台：陆军集结与投送\n· 轨道轰炸：对地压制能力\n\n提示：先选中空天母舰，再使用左侧指令。"
 AEROSPACE_CARRIER_BTN_MUSTER:0 "组建突击陆军"
 AEROSPACE_CARRIER_BTN_MUSTER_TT:0 "在本舰上组建一支突击陆军（免费，但每次出航只能组建一次）。"
 AEROSPACE_CARRIER_BTN_ROBOTIC:0 "组建机器人军团（-100 合金）"
 AEROSPACE_CARRIER_BTN_ROBOTIC_TT:0 "消耗 100 合金，在本舰上组装一支机器人军团。需要机器人劳工科技。"
 AEROSPACE_CARRIER_BTN_BOMBARD:0 "轰炸前置准备（-100 能量币）"
 AEROSPACE_CARRIER_BTN_BOMBARD_TT:0 "消耗 100 能量币，为舰上的轨道轰炸设施加压：一年内本舰的对地轰炸效率 +50%。"
 AEROSPACE_CARRIER_FAIL_NOT_CARRIER:0 "只有在选中空天母舰时才能使用舰桥指令。"
 AEROSPACE_CARRIER_FAIL_ALLOYS:0 "合金不足（需要 100）。"
 aerospace_carrier.2.name:0 "空天母舰 · 舰桥"
 aerospace_carrier.2.desc:0 "舰桥已将集结平台与轰炸设施接入指挥链路。"
 aerospace_carrier.2.a:0 "返回舰队视图。"
 aerospace_carrier_bombardment_ready:0 "轰炸设施就绪"
 MOD_AEROSPACE_CARRIER_BOMBARDMENT_READY:0 "轰炸设施就绪"
 aerospace_carrier_bombardment_ready_desc:0 "轰炸设施已加压：轨道轰炸效率提升。"
 AEROSPACE_CARRIER_FAIL_ENERGY:0 "能量币不足（需要 100）。"
