l_english:
 aerospace_carrier:0 "Aerospace Carrier"
 aerospace_carrier_plural:0 "Aerospace Carriers"
 pc_aerospace_carrier:0 "Aerospace Carrier"
 tech_aerospace_carrier:0 "Aerospace Carriers"
 tech_aerospace_carrier_desc:0 "Compress a starbase shipyard, a colonial administration and an army mustering yard into one hull: the carrier brings its own mobile colony, can bombard a planet from orbit, raises and drops armies, and still fights as a line ship."
 MUSTERING_PLATFORM:0 "Muster Platform"
 MUSTERING_PLATFORM_desc:0 "The army mustering and drop platform aboard the carrier. It speeds up army recruitment on the colony the ship carries, gives new regiments a core of veterans, and sharpens the ship's orbital bombardment."
 mustering_platform:0 "Muster Platform Bay"
 mustering_platform_desc:0 "Sets aside a mustering deck inside the aerospace carrier: armies finish faster, and they are raised by officers who have already seen combat."
 TECH_UNLOCK_AEROSPACE_CARRIER_TITLE:0 "Unlocks ship type: Aerospace Carrier"
 TECH_UNLOCK_AEROSPACE_CARRIER_DESC:0 "Allows starbases with a shipyard to build the Aerospace Carrier. It can carry a mobile colony, and raises armies from it."
 aerospace_carrier_muster_army:0 "Muster Armies"
 aerospace_carrier_muster_army_tooltip:0 "Raise an assault army aboard this carrier."
 aerospace_carrier_mustered_army:0 "Carrier Marine Regiment"
 aerospace_carrier.1.name:0 "Muster Complete"
 aerospace_carrier.1.desc:0 "The mustering platform aboard the aerospace carrier has finished its work; a marine regiment stands ready in the hold."
 aerospace_carrier.1.a:0 "Hold them ready."
 TECH_UNLOCK_AEROSPACE_CARRIER_SHIP_TITLE:0 "Unlocks ship type: Aerospace Carrier"
 TECH_UNLOCK_AEROSPACE_CARRIER_SHIP_DESC:0 "You can build the Aerospace Carrier at a starbase with a shipyard. It brings its own mobile colony, bombards planets from orbit, and raises armies aboard."
 AEROSPACE_CARRIER_BRIDGE_TITLE:0 "Aerospace Carrier - Bridge"
 AEROSPACE_CARRIER_BRIDGE_DESC:0 "This is the bridge. Armies can be raised straight from here, and the bombardment plant can be brought up to pressure. Every order applies to the currently selected aerospace carrier."
 AEROSPACE_CARRIER_BRIDGE_STATUS:0 "Aboard\n- Muster platform: army assembly and drop\n- Bombardment plant: orbital suppression\n\nTip: select the aerospace carrier first, then use the orders on the left."
 AEROSPACE_CARRIER_BTN_MUSTER:0 "Raise assault army"
 AEROSPACE_CARRIER_BTN_MUSTER_TT:0 "Raises an assault army aboard this ship. Free, but only once per deployment."
 AEROSPACE_CARRIER_BTN_ROBOTIC:0 "Assemble robotic legion (-100 alloys)"
 AEROSPACE_CARRIER_BTN_ROBOTIC_TT:0 "Spends 100 alloys to assemble a robotic army aboard this ship. Requires Robotic Workers."
 AEROSPACE_CARRIER_BTN_BOMBARD:0 "Pressurise bombardment plant (-100 energy)"
 AEROSPACE_CARRIER_BTN_BOMBARD_TT:0 "Spends 100 energy to bring the bombardment plant up to pressure: +50% orbital bombardment for one year."
 AEROSPACE_CARRIER_FAIL_NOT_CARRIER:0 "Bridge orders are only available while an aerospace carrier is selected."
 AEROSPACE_CARRIER_FAIL_ALLOYS:0 "Not enough alloys (100 needed)."
 aerospace_carrier.2.name:0 "Aerospace Carrier - Bridge"
 aerospace_carrier.2.desc:0 "The bridge has tied the mustering platform and the bombardment plant into the command loop."
 aerospace_carrier.2.a:0 "Return to the fleet view."
 aerospace_carrier_bombardment_ready:0 "Bombardment Plant Pressurised"
 MOD_AEROSPACE_CARRIER_BOMBARDMENT_READY:0 "Bombardment Plant Pressurised"
 aerospace_carrier_bombardment_ready_desc:0 "The bombardment plant is up to pressure, improving orbital bombardment."
 AEROSPACE_CARRIER_FAIL_ENERGY:0 "Not enough energy (100 needed)."
